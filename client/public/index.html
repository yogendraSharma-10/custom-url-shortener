<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Favicon for the application, typically located in the public folder -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- Optimize for responsive viewing across devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Theme color for mobile browsers (e.g., Android Chrome) -->
    <meta name="theme-color" content="#000000" />
    <!--
      Description of the application.
      Includes a subtle reference to the larger interconnected system for cross-project context.
    -->
    <meta
      name="description"
      content="A custom URL shortener service to create short, memorable links for easy sharing. Part of a larger interconnected system including E-commerce Product Catalog and AI-Powered Content Assistant services."
    />
    <!-- Apple touch icon for iOS devices when adding to home screen -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      The manifest.json file provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      For example: <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
      or <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />

      In development, these URLs are resolved to the root of the project.
      In production, they are resolved to the root of the deployed application.
    -->
    <title>Custom URL Shortener | Shorten Your Links Instantly</title>
  </head>
  <body>
    <!-- Message displayed if JavaScript is disabled in the user's browser -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      This is the root element where our React application will be mounted.
      All React components will be rendered inside this div.
    -->
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag automatically.

      To begin the development, run `npm start` or `yarn start` in the client directory.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
